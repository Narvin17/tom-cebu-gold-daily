name: Decode daily board

on:
  push:
    paths:
      - "latest.png.b64"
      - "boards/*.png.b64"
      - ".github/workflows/decode-png.yml"

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 boards to PNG
        run: |
          set -euo pipefail
          if [ -f latest.png.b64 ]; then
            base64 -d latest.png.b64 > latest.png
          fi
          mkdir -p boards
          shopt -s nullglob
          for f in boards/*.png.b64; do
            base64 -d "$f" > "${f%.b64}"
          done
          git config user.name "tom-gold-daily"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.png boards/*.png || true
          if git diff --cached --quiet; then
            echo "No PNG changes"
          else
            git commit -m "Decode daily price board PNG"
            git push
          fi
